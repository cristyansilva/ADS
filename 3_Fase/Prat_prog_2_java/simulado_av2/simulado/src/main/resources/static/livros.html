<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gerenciador de Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h1>📚 Biblioteca</h1>

<!-- Formulário de Cadastro -->
<div class="card mb-4">
    <div class="card-body">
        <h5>Cadastrar Novo Livro</h5>
        <form th:action="@{/livros}" method="post">
            <div class="row">
                <div class="col-md-4">
                    <input type="text" class="form-control" name="titulo" placeholder="Título" required>
                </div>
                <div class="col-md-3">
                    <input type="text" class="form-control" name="isbn" placeholder="ISBN" required>
                </div>
                <div class="col-md-3">
                    <select class="form-select" name="autor.id" required>
                        <option value="">Selecione o Autor</option>
                        <option th:each="autor : ${autores}"
                                th:value="${autor.id}"
                                th:text="${autor.nome}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- Tabela de Livros -->
<table class="table table-striped">
    <thead>
    <tr>
        <th>ID</th>
        <th>Título</th>
        <th>ISBN</th>
        <th>Autor</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="livro : ${livros}">
        <td th:text="${livro.id}"></td>
        <td th:text="${livro.titulo}"></td>
        <td th:text="${livro.isbn}"></td>
        <td th:text="${livro.autor.nome}"></td>
        <td>
            <a th:href="@{/livros/deletar/{id}(id=${livro.id})}"
               class="btn btn-danger btn-sm"
               onclick="return confirm('Deseja realmente excluir?')">Excluir</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
