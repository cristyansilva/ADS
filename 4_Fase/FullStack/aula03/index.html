<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Interativo de Usuários</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .user-card {
      border-left: 4px solid #2563eb !important;
    }
  </style>
</head>
<body class="bg-light text-dark p-3">

  <header class="navbar navbar-expand-md navbar-dark bg-dark rounded p-3 mb-4 flex-column flex-md-row justify-content-between align-items-center">
    <h1 class="h3 text-white mb-2 mb-md-0">Painel de Usuários</h1>
    <nav class="d-flex gap-3">
      <a href="#" class="nav-link text-secondary fw-semibold">Início</a>
      <a href="#" class="nav-link text-secondary fw-semibold">Usuários</a>
      <a href="#" class="nav-link text-secondary fw-semibold">Cadastros</a>
    </nav>
  </header>

  <main class="container-fluid px-0">
    <div class="row g-4 align-items-start">
      
      <section class="col-12 col-lg-4">
        <div class="card shadow-sm border-0 p-4">
          <h2 class="h5 text-secondary mb-3">Cadastrar Usuário</h2>
          <form id="userForm" class="d-flex flex-column gap-3">
            <input type="text" id="nome" class="form-control" placeholder="Nome completo" required>
            <input type="number" id="idade" class="form-control" placeholder="Idade" required>
            <input type="email" id="email" class="form-control" placeholder="E-mail" required>
            <button type="submit" id="btnCadastrar" class="btn btn-primary fw-bold">Cadastrar</button>
          </form>
          <div id="mensagemStatus" class="fw-bold text-teal mt-3" style="color: #0d9488;"></div>
        </div>
      </section>

      <section class="col-12 col-lg-8">
        <div class="card shadow-sm border-0 p-4">
          <h2 class="h5 text-secondary mb-3">Usuários Cadastrados</h2>
          
          <div class="row g-2 mb-4">
            <div class="col-12 col-md-6">
              <input type="text" id="campoBusca" class="form-control" placeholder="Filtrar por nome...">
            </div>
            <div class="col-12 col-md-6 d-flex gap-2">
              <button id="btnOrdenar" class="btn btn-primary flex-fill fw-bold">Ordenar por Nome</button>
              <button id="btnRemover" class="btn btn-danger flex-fill fw-bold">Remover Último</button>
            </div>
          </div>

          <div id="listaUsuarios" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3">
            </div>
        </div>
      </section>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
