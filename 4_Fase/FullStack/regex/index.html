<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Teste de Regex</title>
</head>
<body>

  <h1>Formulário com Regex</h1>

  <form>
    <fieldset>
      <legend>Dados Solicitados na Atividade sobre Regex</legend>

      <label for="nome">Nome completo:</label><br />
      <input type="text" id="nome" name="nome"  required/><br /><br />


      <label for="cpf">CPF:</label><br />
      <input 
        type="text" 
        id="cpf" 
        name="cpf" 
        pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
        title="Digite o CPF no formato 000.000.000-00"
        required
      /><br /><br />

      <label for="matricula">Matrícula:</label><br />
      <input 
      type="text" 
      name="matricula" 
      id="matricula" 
      pattern="\d{5}"
      title="Digite a matrícula no formato 00000"
       required
      /><br /><br />

      <label for="email">Email:</label><br />
      <input 
      type="email" 
      name="email" 
      id="email"
      pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
      title="Digite um email válido"
      required
      /><br /><br /> 

      <label for="email_fmp">Email da FMP</label><br />
      <input type="email" 
      name="email_fmp" 
      id="email_fmp"
      pattern="[a-z0-9]+(\.[a-z0-9]+)*@aluno.fmpsc.edu.br$"
      title="Digite um email válido da FMP"
      required
        /><br /><br />

      <label for="telefone">Telefone:</label><br />
      <input 
        type="tel" 
        id="telefone" 
        name="telefone" 
        pattern="^\(?\d{2}\)?\s?\d{4,5}-?\d{4}$"
        title="Digite o telefone no formato (11) 99999-9999"
        required
      /><br /><br />

      <label for="data">Data de nascimento:</label><br />
      <input 
        type="text" 
        id="data" 
        name="data" 
        pattern="\d{2}/\d{2}/\d{4}"
        title="Digite a data no formato DD/MM/AAAA"
        required
      /><br /><br /> 

      <label for="rg">RG:</label><br />
      <input
        type="text" 
        id="rg" 
        name="rg" 
        pattern="\d{2}\.\d{3}\.\d{3}-\d{1}"
        title="Digite o RG no formato 00.000.000-0"
        required
      /><br /><br />

      <label for="cnpj">CNPJ: </label><br />
      <input
        type="text"
        id="cnpj"
        name="cnpj"
        pattern="\d{2}.\d{3}.\d{3}/\d{4}-\d{2}"
        title="Digite o CNPJ no formato 00.000.000/0000-00"
        required
        /><br /><br />

        
        <label for="num_cartao">Número do Cartão:</label><br />
        <input type="text"
        id="num_cartao"
        name="num_cartao"
        pattern="^4[0-9]{12}(?:[0-9]{3})?$" 
        required
        /><br/ ><br
        


        <label for="validade_cartao">Validade do Cartão</label><br />
        <input type="date" 
        name="validade_cartao" 
        id="validade_cartao"
        pattern="\d{2}/\d{2}/\d{4}$"
        required
        /><br /><br />
        

        <label for="cvv">CVV: </label><br />
        <input type="text" 
        name="cvv" 
        id="cvv"
        pattern="^\d{3}$"
        title="Preencha no formato: xxx"
        required
        /><br/ ><br
        

        <label for="ie">Inscrição Estadual: </label><br />
        <input type="text" 
        name="ie" 
        id="ie"
        pattern="^\d{3}.\d{3}.\d{3}$"
        title="Preencha no formato : 000.000.000"
        required
        /><br/ ><br
        

        <label for="endereco">Endereço: </label><br />
        <input type="text" 
        name="endereco" 
        id="endereco"
        pattern="^([\w\w]+)\s(\d+)$"
        title="Preencha o nome da rua e o numero do imovel"
        required
        /><br/ ><br
        

        <label for="cep">CEP: </label><br />
        <input type="text" 
        name="cep" 
        id="cep"
        pattern="^\d{5}-\d{3}$"
        title="Preencha no formato: 00000-000"
        required
        /><br/ ><br
        

        <label for="tipo_sanguineo">Tipo Sanguíneo: </label><br />
        <input 
            type="text" 
            name="tipo_sanguineo" 
            id="tipo_sanguineo"
            pattern="^(A|B|AB|O)(\+|-)$"
            title="Digite um tipo sanguíneo válido: A+, A-, B+, B-, AB+, AB-, O+ ou O-"
            required
            /><br/ ><br
            
            
        <label for="lote">Lote: </label><br />
        <input type="text" 
        name="lote" 
        id="lote"
        pattern="^\d{8}-\d{3}$"
        title="Use o padrao: 00000000-000"
        required
        /><br/ ><br />

        <label for="latitude">Latitude: </label><br />
        <input type="text"
        name="latitude"
        id="latitude"
        pattern="^-?(?:90(?:\.0+)?|[0-8]?\d(?:\.\d+)?)$"
        title="Digite uma latitude válida entre -90 e 90 graus, usando ponto para casas decimais."
        required
         /><br/ ><br />

         <label for="long">Longiitude: </label><br />
        <input type="text"
        name="long"
        id="long"
        pattern="^-?(?:180(?:\.0+)?|1[0-7]\d(?:\.\d+)?|[0-9]?\d(?:\.\d+)?)$"
        title="Digite uma longitude válida entre -180 e 180 graus, usando ponto para casas decimais."
        required
         /><br/ ><br />

         <label for="ean13">Codigo de Barras EAN13</label><br />
         <input type="number" 
         name="ean" 
         id="ean"
         pattern="^\d{13}$"
         title="use 13 digitos"
         required
          /><br/ ><br />

        <label for="placa">Placa Mercosul: </label><br/>
        <input type="text" 
        name="placa" 
        id="placa"
        pattern="^\w{3}\d{1}\w{1}\d{2}$"
        title="Use o padrao:  LLLNLNN (três letras, um número, uma letra e dois números)"
        required
       /><br/ ><br />



      <button type="submit">Enviar</button>
    </fieldset>
  </form>

</body>
</html>
